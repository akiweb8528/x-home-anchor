<!doctype html>
<meta charset="utf-8">
<title>Repost hold synthetic fixture</title>
<style>
  body { margin: 0; background: #101214; color: #eee; font: 16px system-ui; }
  main { width: min(580px, 100%); margin: auto; }
  article { border: 1px solid #4a4e52; padding: 24px; }
  a { color: #90caf9; } button { color: inherit; background: #23282c; border: 1px solid #747c82; border-radius: 24px; width: 64px; height: 44px; }
  button:hover { background: #304b42; } svg { width: 24px; height: 24px; fill: currentColor; }
  [data-testid="quoteTweet"] { padding: 16px; border: 1px solid #50565b; margin: 16px 0; }
  #menu { position: absolute; background: #23352e; padding: 12px; border: 1px solid #85968e; }
  .space { height: 1800px; }
</style>
<main data-testid="primaryColumn">
  <h1>Synthetic timeline</h1>
  <button id="refresh" style="width:180px">Show 35 new posts</button>
  <div role="tab" aria-selected="true">Unknown tab</div>
  <section aria-label="Timeline: Synthetic">
    <article data-testid="tweet">
      <button data-testid="caret" aria-label="More">More</button>
      <div data-testid="quoteTweet" role="link">
        <div data-testid="User-Name"><a href="/quoted/status/222"><time>Quoted time</time></a></div>
        <div data-testid="card.wrapper"><a href="/preview/status/333"><time>Preview time</time></a></div>
        <p>Quoted content</p>
      </div>
      <div data-testid="User-Name">Synthetic author · <a role="link" href="/outer/status/111"><time>Outer time</time></a></div>
      <p data-testid="tweetText">A synthetic post with a quoted card.</p>
      <a href="/outer/status/111/analytics">Analytics</a>
      <button data-testid="retweet" aria-haspopup="menu" aria-label="Repost"><div><svg viewBox="0 0 24 24"><path d="M3 7h15l-3-3 1-1 5 5-5 5-1-1 3-3H5v4H3zm18 10H6l3 3-1 1-5-5 5-5 1 1-3 3h13v-4h2z"/></svg></div></button>
    </article>
  </section>
  <output id="result" aria-live="polite">Ready</output>
  <div class="space"></div>
</main>
<script>
  window.events = [];
  window.menuClicks = 0;
  window.navigations = [];
  const record = (type, extra = {}) => events.push({ type, at: performance.now(), ...extra });
  for (const type of ['pointerdown', 'pointerup', 'pointercancel', 'contextmenu', 'auxclick']) {
    window.addEventListener(type, e => record(type, { trusted: e.isTrusted, pointerType: e.pointerType, pointerId: e.pointerId, button: e.button }), true);
  }
  if (location.pathname === '/outer/status/111') {
    const metadata = document.createElement('div');
    metadata.append(document.querySelector('a[href="/outer/status/111"]'));
    document.querySelector('article').append(metadata);
  }
  window.menuDelay = 0;
  window.moreClicks = 0;
  window.omitActivity = false;
  window.inertActivity = false;
  document.addEventListener('click', e => {
    const more = e.target.closest('button[data-testid="caret"]');
    if (!more) return;
    moreClicks++;
    const show = () => {
      document.querySelector('#activity')?.remove();
      const menu = document.createElement('div'); menu.id = 'activity'; menu.setAttribute('role', 'menu');
      if (!omitActivity) {
        const link = document.createElement('a'); link.setAttribute('role', 'menuitem');
        link.href = '/outer/status/111/quotes'; link.textContent = 'View post activity';
        link.addEventListener('click', event => {
          event.preventDefault(); menu.remove();
          if (inertActivity) return;
          navigations.push(link.href); record('quotes', { url:link.href });
          history.pushState({}, '', link.href);
          document.querySelector('#result').textContent = 'Quotes: ' + link.href;
          requestAnimationFrame(() => record('quotes-frame', { text:document.querySelector('#result').textContent }));
        });
        menu.append(link);
      }
      document.body.append(menu);
    };
    if (menuDelay) setTimeout(show, menuDelay); else queueMicrotask(show);
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('button[data-testid="retweet"], button[data-testid="unretweet"]')) return;
    menuClicks++; record('menu', { trusted: e.isTrusted, detail: e.detail });
    document.querySelector('#menu')?.remove();
    const menu = document.createElement('div'); menu.id = 'menu'; menu.textContent = 'Repost / Quote';
    e.target.closest('button').after(menu);
  });
  window.chrome = { runtime: { id: 'synthetic-extension', onMessage: { addListener() {}, removeListener() {} } } };
</script>
